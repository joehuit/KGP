[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgp-list-backend"
version = "0.1.0"
description = "FastAPI backend for KGP LIST spare-parts catalog and ordering platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KGP Development Team", email = "dev@kgp-list.dz" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "SQLAlchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "bcrypt>=4.1.0",
    "passlib>=1.7.4",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as requiring external live infrastructure like PostgreSQL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
