version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kgp_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kgp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgp_secret_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-kgp_db}
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kgp_postgres_dev_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgp_user} -d ${POSTGRES_DB:-kgp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kgp_postgres_dev_data:
    name: kgp_postgres_dev_data
