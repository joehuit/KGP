version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: kgp_backend_prod
    restart: always
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kgp_internal_net
    expose:
      - "8000"

  postgres:
    image: postgres:16-alpine
    container_name: kgp_postgres_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - kgp_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kgp_internal_net
    # Port 5432 is intentionally NOT exposed to host in production for security

  nginx:
    image: nginx:alpine
    container_name: kgp_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - kgp_internal_net

networks:
  kgp_internal_net:
    driver: bridge

volumes:
  kgp_prod_db_data:
    name: kgp_prod_db_data
